<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Krikverse">
<title>Krikverse - Cricket Live</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #071426;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  height: 58px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: #0b1b30;
  border-bottom: 1px solid #22334a;
}
.logo {
  font-size: 23px;
  font-weight: 900;
}
.logo span {
  color: #00d084;
}
main {
  height: calc(100dvh - 58px);
  width: 100%;
}
iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
}
.fallback {
  padding: 10px;
  text-align: center;
  font-size: 13px;
  background: #10243b;
}
a {
  color: #00d084;
}
</style>
</head>

<body>
<header>
  <div class="logo">KRIK<span>VERSE</span></div>
</header>

<main>
  <iframe
    src="https://krikverse.blogspot.com/"
    title="Krikverse Cricket Website">
  </iframe>
</main>

<div class="fallback">
  Website नहीं खुल रही?
  <a href="https://krikverse.blogspot.com/" target="_blank">
    Open Krikverse
  </a>
</div>

</body>
</html>
