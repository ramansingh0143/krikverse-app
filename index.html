
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">

  <title>Krikverse - Live Cricket</title>
  <meta name="description" content="Krikverse - Live Cricket Scores, Matches and Updates">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Krikverse">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #071426;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      height: 58px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: #0b1b30;
      border-bottom: 1px solid #22334a;
    }
    .logo {
      font-size: 23px;
      font-weight: 900;
    }
    .logo span { color: #00d084; }
    main {
      height: calc(100dvh - 58px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
    .fallback {
      padding: 10px;
      text-align: center;
      font-size: 13px;
      background: #10243b;
    }
    a { color: #00d084; }
  </style>
</head>

<body>
  <header>
    <div class="logo">KRIK<span>VERSE</span></div>
  </header>

  <main>
    <iframe
      src="https://krikverse.blogspot.com/"
      title="Krikverse Cricket Website">
    </iframe>
  </main>

  <div class="fallback">
    Website नहीं खुल रही?
    <a href="https://krikverse.blogspot.com/" target="_blank">
      Open Krikverse
    </a>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(reg => console.log("Krikverse SW registered", reg))
          .catch(err => console.log("SW error", err));
      });
    }
  </script>
</body>
</html>
